      <!-- agent:content:start --><noscript><article class="agent-readable" aria-label="Angel investing"><p>I write personal $5K-$30K checks into very early technical teams.</p><p>I write checks of $5K-$30K into very early, exceptional teams building in Agentic Commonwealth, American Dynamism, Kinetic Sovereignty.</p><p>There is no formula for predicting which startups become unicorns, but these signals make me want to hop on a Google Meet with you. I call it the 20-point rule.</p><dl><div><dt>Team synergy &amp; story</dt><dd>+5</dd></div><div><dt>High agency and proof of building, failing, and learning</dt><dd>+4</dd></div><div><dt>Honesty &amp; asking for help</dt><dd>+4</dd></div><div><dt>A technical edge</dt><dd>+2</dd></div><div><dt>A non-cliched contrarian take on the world</dt><dd>+1</dd></div><div><dt>A working artifact, however ugly</dt><dd>+1</dd></div><div><dt>Evidence-backed pivots</dt><dd>+1 each, max +3</dd></div></dl><p>I am most useful before the story gets polished. I love it when technical insight does most of the talking.</p><p>No warm introductions are required, but managing to find one gets you brownie points.</p><p>I don&#039;t care for decks. A Google Doc is more than enough. Clarity of thought is what I look for.</p><p>If I like you but I&#039;m not in a position to fund you, I will personally refer you to investment partners at Founders, Inc. and a16z Speedrun.</p><p><a href="mailto:naladala@uw.edu?subject=Angel%20pitch%20-%20%5BCompany%5D">Send the company</a></p></article></noscript><!-- agent:content:end -->
