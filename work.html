        <p class="page-intro__note">All that fucking around led me to some problems I took personally.</p>

      <div class="page-content" id="pageContent"></div>
      <!-- agent:content:start --><noscript><article class="agent-readable" aria-label="Professional experience"><section><h2>R0 Systems</h2><p><strong>Founder &amp; CEO</strong></p><p><time datetime="2024-06">Jun 2024 - Present</time></p><ul><li>R0 generates produce sanitizer on site using air, water, and electricity. I bootstrapped it to six figures in revenue.</li><li>I designed the reactor, Venturi transfer stage, water loop, controls, and field hardware.</li><li>The machines now run continuously in customer facilities.</li><li>Three peer-reviewed papers, two pending patents, and independent national food-safety laboratory studies document the system.</li><li>Demonstrated up to 3x shelf-life extension at under $0.50 per ton in energy cost across tomato and leafy-green validation studies.</li></ul></section><section><h2>OpenTrade</h2><p><strong>Machine Learning Engineer</strong></p><p><time datetime="2026-06">Jun 2026 - Sep 2026</time></p><ul><li>As OpenTrade&#039;s first ML hire, I built market-data grounding, trade-card generation, and personalized ranking.</li><li>Replaced hand-tuned feed ordering with a learned ranking model built from user interaction, content, recency, and market-context signals and evaluated releases through offline replay and product behavior.</li><li>Built a factual-accuracy and regression harness for generated financial content, checking grounding against live market data, numerical consistency, temporal validity, unsupported claims, and structured-output compliance across model and prompt releases.</li><li>Turned impressions and downstream behavior into evaluation and training signals for subsequent model releases.</li><li>Defined launch hypotheses, primary metrics, and guardrails before each production release.</li><li>Built backend and serverless API routes serving model outputs, integrated external market-data providers, and owned testing, deployment, and CI for a product that grew from launch to roughly 150,000 monthly users in two months.</li></ul></section><section><h2>Sensors, Energy, and Automation Laboratory</h2><p><strong>Research Associate</strong></p><p><time datetime="2025-03">Mar 2025 - Nov 2025</time></p><ul><li>Engineered a real-time PPG wearable: transimpedance front end, fourth-order Butterworth filter, 100 Hz 12-bit acquisition, and adaptive motion-artifact cancellation rejecting 95% of motion artifact.</li><li>Built a PZT-array acoustic-emission system for U.S. Navy hull-integrity monitoring, using charge amplification, 10 kHz acquisition, and a real-time 512-point FFT pipeline to separate impacts from fatigue-crack signatures.</li><li>Handled analog design, prototype bring-up, embedded acquisition, signal processing, bench characterization, and failure analysis.</li><li>Authored the sensing architecture, signal-processing methodology, and validation sections of two funded proposals across a seven-person research team.</li></ul></section><section><h2>CSIR-National Institute for Interdisciplinary Science and Technology</h2><p><strong>Research Associate</strong></p><p><time datetime="2024-06">Jun 2024 - Mar 2025</time></p><ul><li>Researched dye-sensitized and perovskite photovoltaics within CSIR-NIIST&#039;s indoor-light energy-harvesting program, whose dye-sensitized-cell work later reached a 40% indoor-light conversion-efficiency record.</li><li>Fabricated complete solar-cell devices using FTO substrates, TiO2 photoanodes, thermal processing, ruthenium sensitizers, electrolytes, counter electrodes, and sealed assemblies.</li><li>Ran the full optoelectronic and structural characterization stack: J-V curves, IPCE, photoinduced absorption spectroscopy, and XRD with Scherrer crystallite-size analysis.</li><li>Connected spectral response, charge-recombination behavior, crystallite structure, and fabrication parameters to device-level efficiency and failure modes.</li><li>Designed controlled experiments across photoanode architecture and processing conditions, then analyzed batch variation and reproducibility across fabricated devices.</li></ul></section><section><h2>Ingenium Naturae</h2><p><strong>Research Engineer</strong></p><p><time datetime="2023-05">May 2023 - Jun 2024</time></p><ul><li>Delivered custom plasma and automation machines for agri-food clients. Each build combined power electronics, embedded control, fluidics, reactor design, and industrial mechanics.</li><li>Designed 20 kV discharge drivers, MOSFET switching stages, PID control loops, STM32 firmware, electrode and reactor geometries, Venturi injectors, and production CAD assemblies.</li><li>Handled client specifications, system architecture, component selection, fabrication, wiring, firmware, validation, acceptance testing, documentation, and handoff.</li><li>Debugged coupled electrical, thermal, fluidic, and mechanical failure modes on the shop floor until each machine met its operating requirements.</li></ul></section></article></noscript><!-- agent:content:end -->
