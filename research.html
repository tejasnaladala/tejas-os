        <div><h1>Research.</h1></div>
        <p class="page-intro__note">I wrote down the answers that held up.</p>
      </header>
      <div class="page-content" id="pageContent"></div>
      <!-- agent:content:start --><noscript><article class="agent-readable" aria-label="Research record"><h2>Research</h2><section><h3>MTEB-Gym: label-free embedding evaluation</h3><p><strong>When can label-free embedding evaluation produce a trustworthy model ranking?</strong></p><p><time datetime="2026-06">Jun 2026 - Present</time></p><ul><li>Co-developed MTEB-Gym, a label-free framework for ranking embedding models on datasets without human relevance annotations.</li><li>Worked on bidirectional judging, validation, uncertainty estimates, and failure handling for label-free rankings.</li><li>Merged nine changes covering validation, uncertainty estimates, caching, deterministic parallelism, and failure handling.</li></ul><p><strong>Current result:</strong> Nine merged upstream changes cover validation, uncertainty estimates, cache behavior, deterministic parallelism, and failure handling.</p><p><strong>Boundary:</strong> The active reliability study still needs a public result artifact.</p></section><section><h3>RSNA Knee Abnormality Detection</h3><p><strong>Which validation choices materially change a knee-MRI model&#039;s reported AUC?</strong></p><p><time datetime="2026-07">Jul 2026 - Present</time></p><ul><li>Built a knee-MRI evaluation pipeline around ordered slices, hierarchical 2.5D multiple-instance learning, and study-level aggregation.</li><li>Added patient/study splits, fold-integrity checks, leakage audits, label-quality analysis, and metric-consistency tests to the experiment path.</li><li>In progress.</li></ul><p><strong>Current result:</strong> The current artifact covers study-level aggregation, leakage checks, fold audits, and metric-consistency tests.</p><p><strong>Boundary:</strong> In progress.</p></section><section><h3>AgentBreed</h3><p><strong>How much agent performance comes from the configuration space, and how much from the search operator?</strong></p><p><time datetime="2026-03">Mar 2026 - Present</time></p><ul><li>Designed a preregistered study of configuration-space richness and search algorithms in multi-agent systems.</li><li>Ran 700 reproducible evaluations across three domains in a deterministic simulator.</li><li>Compared search operators with Holm-corrected pairwise tests; none reached corrected significance in the synthetic pilot.</li><li>The real-LLM replication is preregistered and pending; current results cover the simulator.</li></ul><p><strong>Current result:</strong> In the 700-run deterministic synthetic pilot, pairwise differences among the tested search operators did not reach Holm-corrected significance.</p><p><strong>Boundary:</strong> This result does not establish equivalence among search operators. The real-LLM replication is preregistered and pending, and the current sensitivity-analysis output is not used for inference.</p></section><section><h3>Procedural-Maze RL Baselines</h3><p><strong>Why did modern reward-driven RL miss a policy a five-line heuristic could see?</strong></p><p><time datetime="2026-02">Feb 2026 - Apr 2026</time></p><ul><li>Benchmarked PPO, DQN, and A2C on procedurally generated mazes against simple heuristics and behavior cloning.</li><li>The policy class can express strong maze-solving behavior; reward-driven training struggled to reach it consistently.</li><li>The public repository includes experiment code, run records, manifests, and a result verifier.</li><li>Later runs outgrew the pinned manifest. Artifact reconciliation is in progress before final reporting.</li></ul><p><strong>Current result:</strong> The policy class can express strong maze-solving behavior; reward-driven training struggled to reach it consistently.</p><p><strong>Boundary:</strong> Later runs outgrew the pinned manifest. Artifact reconciliation is in progress before final reporting.</p></section><section><h3>Connectome Architecture Benchmark</h3><p><strong>Does biological wiring still help after density, weights, graph realizations, and trainable components are controlled?</strong></p><p><time datetime="2025-12">Dec 2025 - Present</time></p><ul><li>Built a controlled benchmark for biological connectomes and matched random graphs.</li><li>Audited and invalidated the original 757-row pilot after finding control-density, provenance, optimizer, and evaluation failures.</li><li>Rebuilt CAB v2 around digest-bound measured connectomes, readout-only optimization, and nulls matched on exact edge count and weight distribution.</li><li>CAB v2 is implemented and tested. The full corrected run is pending.</li></ul><p><strong>Current result:</strong> The first pass found confounds in null-graph density, weight distributions, dataset provenance, and what the optimizer was allowed to train.</p><p><strong>Boundary:</strong> The original 757-row artifact is invalidated. CAB v2 awaits a full corrected run.</p></section><section><h3>Regional Cabled Array expedition RR2607</h3><p><strong>Can methane-bubble flux be estimated while the experiment is 2,900 meters underwater?</strong></p><p><time datetime="2026-08">Aug 2026 - Present</time></p><ul><li>Building a field-to-analysis system for methane-bubble flux estimation from ROV video, sonar, hydrophone, CTD, and navigation data.</li><li>The provenance layer keeps shipboard sources read-only and traces every derived artifact to source paths, hashes, and code versions.</li><li>Current work covers computer vision, acoustic alignment, calibration, and held-out validation.</li><li>Work in progress.</li></ul><p><strong>Current result:</strong> Building a provenance-aware pipeline that aligns computer vision, sonar, and field metadata.</p><p><strong>Boundary:</strong> Work in progress; no final scientific result is claimed.</p></section><h2>Technical notes</h2><section><h3>VLM Inference Optimization</h3><p>Advised by Professor Zhuang Liu at Princeton University.</p><ul><li>An AlphaEvolve-style search loop produced a best single-prompt Qwen3-VL configuration at 63.25% held-out accuracy on CharXiv chart QA; its difference from the 60.5% manual prompt was not significant (p = .42).</li><li>MAP-Elites searched prompt, parsing, formatting, and inference-code variants across a behavioral archive.</li><li>A separately designed per-question router reached 73.0%, compared with the 29.5% naive baseline.</li><li>The router-to-naive paired comparison gave p = 2.4e-6, and every accepted mutation retained inspectable lineage.</li></ul></section><section><h3>Single-GPU Model Serving</h3><p>Advised by Professor Juncheng Yang at Harvard University.</p><ul><li>An 80-point vLLM matrix compared dense and mixture-of-experts models at roughly equal active-parameter budgets.</li><li>The benchmark swept prompt length, generation length, concurrency, and serving configuration across Qwen3.5-9B and GLM-4.7-Flash.</li><li>The dense/MoE throughput crossover appeared near concurrency three. At 49K-token generation, Qwen admitted 42 concurrent requests versus GLM&#039;s 10.</li><li>A hardware audit caught a PCIe-throttled H100 before publication; GPQA accuracy moved by 20 points with token budget.</li></ul></section><h2>Published record</h2><p>Three peer-reviewed papers, 57 citations, and an h-index of 3 as of 2026-09.</p><ol><li><a href="https://doi.org/10.1088/1361-6463/ad77de">Design of systems for plasma activated water (PAW) for agri-food applications</a>, Journal of Physics D: Applied Physics, 2024</li><li><a href="https://doi.org/10.1016/j.ifset.2024.103845">Design of a continuous plasma activated water (PAW) disinfection system for fresh produce industry</a>, Innovative Food Science &amp; Emerging Technologies, 2024</li><li><a href="https://doi.org/10.1016/j.ifset.2024.103840">Design and construction of a continuous industrial scale cold plasma equipment for fresh produce industry</a>, Innovative Food Science &amp; Emerging Technologies, 2024</li></ol></article></noscript><!-- agent:content:end -->
