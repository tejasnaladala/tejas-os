        <div><h1>Research.</h1></div>
        <p class="page-intro__note">All that finding out led me to some answers I documented.</p>

      <!-- agent:content:start --><noscript><article class="agent-readable" aria-label="Research record"><h2>Research</h2><section><h3>MTEB-Gym: label-free embedding evaluation</h3><p><strong>When can label-free embedding evaluation produce a trustworthy model ranking?</strong></p><p><time datetime="2026-06">Jun 2026 - Present</time></p><ul><li>Co-developed MTEB-Gym, a label-free framework for ranking embedding models on datasets without human relevance annotations.</li><li>Designed the judge-reliability study across 16 retrieval datasets and identified when LLM-based evaluation could and could not be trusted.</li><li>Diagnosed task-definition mismatch as the framework&#039;s main failure mode and improved ranking quality by adding dataset-specific evaluation criteria.</li><li>Contributed production-grade tooling to the MTEB ecosystem and built a public leaderboard that reports reliability alongside every model ranking.</li></ul><p><strong>Current result:</strong> Nine merged upstream changes cover validation, uncertainty estimates, cache behavior, deterministic parallelism, and failure handling.</p><p><strong>Boundary:</strong> The active reliability study still needs a public result artifact.</p></section><section><h3>RSNA Knee Abnormality Detection</h3><p><strong>Which validation choices materially change a knee-MRI model&#039;s reported AUC?</strong></p><p><time datetime="2026-07">Jul 2026 - Aug 2026</time></p><ul><li>Built a complete ML platform for the Radiological Society of North America&#039;s Knee Abnormality Detection competition, predicting 12 study-level findings from multi-plane MRI across 4,407 studies and 24,371 imaging series. I also completed an exact census of 819,078 DICOM files.</li><li>Advanced the project&#039;s authenticated Kaggle public macro ROC-AUC from 0.618 to 0.912 across seven tracked submissions. A controlled ablation improved AUC from 0.618 to 0.764 by changing only report-derived supervision, identifying label quality as a primary modeling bottleneck.</li><li>Implemented deterministic 2.5D ResNet-18 MIL and five-fold, three-plane EfficientNet-B3 training systems, then integrated DINO- and RadImageNet-based inference branches using rank fusion, label-specific fallback policies, and cross-label stacking.</li><li>Engineered reproducible offline GPU execution with geometrically ordered MRI slices, hash-bound caches, mixed-precision training, RNG-complete checkpoint and resume, fresh-checkpoint inference replay, and atomic artifact publication. A private Kaggle T4 run featurized all 4,407 studies with zero failures.</li></ul><p><strong>Current result:</strong> The authenticated Kaggle public macro ROC-AUC improved from 0.618 to 0.912 across seven tracked submissions.</p><p><strong>Boundary:</strong> The completed study used competition data and public leaderboard evaluation.</p></section><section><h3>AgentBreed</h3><p><strong>How much agent performance comes from the configuration space, and how much from the search operator?</strong></p><p><time datetime="2026-03">Mar 2026 - Jul 2026</time></p><ul><li>Designed a pre-registered study testing whether multi-agent performance depends more on the available configuration space or the search algorithm.</li><li>Ran 700 reproducible evaluations across three domains using a deterministic simulator to separate true effects from LLM sampling noise.</li><li>Used equivalence testing and sensitivity analysis to identify which agent-design choices meaningfully affected performance.</li><li>Built a heavily tested research codebase and kept the study&#039;s conclusions explicitly limited to the deterministic simulator.</li></ul><p><strong>Current result:</strong> In the 700-run deterministic synthetic pilot, pairwise differences among the tested search operators did not reach Holm-corrected significance.</p><p><strong>Boundary:</strong> The reported conclusions apply to the deterministic simulator used in the completed study.</p></section><section><h3>Procedural-Maze RL Baselines</h3><p><strong>Why did modern reward-driven RL miss a policy a five-line heuristic could see?</strong></p><p><time datetime="2026-02">Feb 2026 - Apr 2026</time></p><ul><li>Benchmarked PPO, DQN, and A2C on procedurally generated mazes against simple heuristics and behavior cloning.</li><li>Found that the learned agents had sufficient capacity but failed because of exploration and credit-assignment limitations.</li><li>Built a reproducible experiment pipeline with roughly 3,500 traceable run artifacts.</li><li>Corrected the original study&#039;s validation flaw by rebuilding the evaluation around a proper held-out protocol.</li></ul><p><strong>Current result:</strong> The learned agents had sufficient capacity but failed because of exploration and credit-assignment limitations.</p><p><strong>Boundary:</strong> The final evaluation uses the corrected held-out protocol.</p></section><section><h3>Connectome Architecture Benchmark</h3><p><strong>Does biological wiring still help after density, weights, graph realizations, and trainable components are controlled?</strong></p><p><time datetime="2025-12">Dec 2025 - Aug 2026</time></p><ul><li>Built a controlled benchmark testing whether biological connectomes provide better neural-network architectures than matched random graphs.</li><li>Evaluated ten connectomes across six tasks while keeping the biological wiring fixed and training only the output layer.</li><li>Found that biological structure sometimes helped, but degree distribution explained much of the advantage while exact biological wiring explained less.</li><li>Tested the result against matched random graphs and controls for graph density, edge weights, and trainable components.</li></ul><p><strong>Current result:</strong> Biological structure sometimes helped, but degree distribution explained much of the advantage while exact biological wiring explained less.</p><p><strong>Boundary:</strong> The completed analysis controlled graph density, edge weights, graph realizations, and trainable components.</p></section><section><h3>Regional Cabled Array expedition RR2607</h3><p><strong>Can methane-bubble flux be estimated while the experiment is 2,900 meters underwater?</strong></p><p><time datetime="2026-08">Aug 2026 - Present</time></p><ul><li>Building a field-to-analysis system for methane-bubble flux estimation from ROV video, sonar, hydrophone, CTD, and navigation data.</li><li>The provenance layer keeps shipboard sources read-only and traces every derived artifact to source paths, hashes, and code versions.</li><li>Current work covers computer vision, acoustic alignment, calibration, and held-out validation.</li><li>Work in progress.</li></ul><p><strong>Current result:</strong> Building a provenance-aware pipeline that aligns computer vision, sonar, and field metadata.</p><p><strong>Boundary:</strong> Work in progress; no final scientific result is claimed.</p></section><h2>Technical notes</h2><section><h3>VLM Inference Optimization</h3><p>Advised by Professor Zhuang Liu at Princeton University.</p><ul><li>An AlphaEvolve-style search loop produced a best single-prompt Qwen3-VL configuration at 63.25% held-out accuracy on CharXiv chart QA; its difference from the 60.5% manual prompt was not significant (p = .42).</li><li>MAP-Elites searched prompt, parsing, formatting, and inference-code variants across a behavioral archive.</li><li>A separately designed per-question router reached 73.0%, compared with the 29.5% naive baseline.</li><li>The router-to-naive paired comparison gave p = 2.4e-6, and every accepted mutation retained inspectable lineage.</li></ul></section><section><h3>Single-GPU Model Serving</h3><p>Advised by Professor Juncheng Yang at Harvard University.</p><ul><li>An 80-point vLLM matrix compared dense and mixture-of-experts models at roughly equal active-parameter budgets.</li><li>The benchmark swept prompt length, generation length, concurrency, and serving configuration across Qwen3.5-9B and GLM-4.7-Flash.</li><li>The dense/MoE throughput crossover appeared near concurrency three. At 49K-token generation, Qwen admitted 42 concurrent requests versus GLM&#039;s 10.</li><li>A hardware audit caught a PCIe-throttled H100 before publication; GPQA accuracy moved by 20 points with token budget.</li></ul></section><h2>Published record</h2><p>Three peer-reviewed papers, 57 citations, and an h-index of 3 as of 2026-09.</p><ol><li><a href="https://doi.org/10.1088/1361-6463/ad77de">Design of systems for plasma activated water (PAW) for agri-food applications</a>, Journal of Physics D: Applied Physics, 2024</li><li><a href="https://doi.org/10.1016/j.ifset.2024.103845">Design of a continuous plasma activated water (PAW) disinfection system for fresh produce industry</a>, Innovative Food Science &amp; Emerging Technologies, 2024</li><li><a href="https://doi.org/10.1016/j.ifset.2024.103840">Design and construction of a continuous industrial scale cold plasma equipment for fresh produce industry</a>, Innovative Food Science &amp; Emerging Technologies, 2024</li></ol></article></noscript><!-- agent:content:end -->
