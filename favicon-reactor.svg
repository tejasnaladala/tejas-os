<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Animated pixel plasma reactor</title>
  <style>
    .frame { opacity: 0; animation: frame 1.6s steps(1, end) infinite; }
    .frame-2 { animation-delay: .4s; }
    .frame-3 { animation-delay: .8s; }
    .frame-4 { animation-delay: 1.2s; }
    @keyframes frame { 0%, 24.99% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .frame { animation: none; opacity: 0; }
      .frame-1 { opacity: 1; }
    }
  </style>
  <rect width="32" height="32" fill="#f4f1e8"/>
  <path fill="#11110f" d="M13 3h6v2h2v3h-2v2h4v3h2v12h-3v4h-4v-4h-4v4h-4v-4H7V13h2v-3h4V8h-2V5h2zm-2 10v10h10V13z"/>
  <rect x="13" y="6" width="6" height="2" fill="#78b8e7"/>
  <rect x="11" y="14" width="2" height="2" fill="#ed93aa"/>
  <rect x="19" y="20" width="2" height="2" fill="#61ad58"/>
  <g class="frame frame-1">
    <rect x="15" y="20" width="2" height="2" fill="#2f6fc7"/>
    <rect x="3" y="17" width="2" height="2" fill="#ed93aa"/>
    <rect x="27" y="11" width="2" height="2" fill="#efb548"/>
  </g>
  <g class="frame frame-2">
    <rect x="15" y="17" width="2" height="2" fill="#78b8e7"/>
    <rect x="12" y="20" width="2" height="2" fill="#efb548"/>
    <rect x="4" y="14" width="2" height="2" fill="#ed93aa"/>
  </g>
  <g class="frame frame-3">
    <rect x="15" y="14" width="2" height="2" fill="#ed93aa"/>
    <rect x="18" y="17" width="2" height="2" fill="#61ad58"/>
    <rect x="26" y="8" width="2" height="2" fill="#2f6fc7"/>
  </g>
  <g class="frame frame-4">
    <rect x="15" y="11" width="2" height="2" fill="#efb548"/>
    <rect x="14" y="1" width="2" height="2" fill="#efb548"/>
    <rect x="11" y="3" width="2" height="2" fill="#e96470"/>
    <rect x="18" y="2" width="2" height="2" fill="#78b8e7"/>
    <rect x="27" y="14" width="2" height="2" fill="#61ad58"/>
  </g>
</svg>
