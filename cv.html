      <!-- agent:content:start --><noscript><article class="agent-readable" aria-label="CV summary"><p>Tejas Naladala is a 19-year-old Engineering student at the University of Washington, founder of R0 Systems, and an empirical machine-learning researcher.</p><h2>Experience</h2><p><strong>R0 Systems</strong>, Founder &amp; CEO, Jun 2024 - Present</p><p><strong>OpenTrade</strong>, Machine Learning Engineer, Jun 2026 - Sep 2026</p><p><strong>Sensors, Energy, and Automation Laboratory</strong>, Research Associate, Mar 2025 - Nov 2025</p><p><strong>CSIR-National Institute for Interdisciplinary Science and Technology</strong>, Research Associate, Jun 2024 - Mar 2025</p><p><strong>Ingenium Naturae</strong>, Research Engineer, May 2023 - Jun 2024</p><h2>Research</h2><p><strong>MTEB-Gym: label-free embedding evaluation</strong>: When can label-free embedding evaluation produce a trustworthy model ranking?</p><p><strong>RSNA Knee Abnormality Detection</strong>: Which validation choices materially change a knee-MRI model&#039;s reported AUC?</p><p><strong>AgentBreed</strong>: How much agent performance comes from the configuration space, and how much from the search operator?</p><p><strong>Procedural-Maze RL Baselines</strong>: Why did modern reward-driven RL miss a policy a five-line heuristic could see?</p><p><strong>Connectome Architecture Benchmark</strong>: Does biological wiring still help after density, weights, graph realizations, and trainable components are controlled?</p><p><strong>Regional Cabled Array expedition RR2607</strong>: Can methane-bubble flux be estimated while the experiment is 2,900 meters underwater?</p><p><a href="/assets/resume.pdf?v=20260901.15">View the complete CV (PDF)</a></p></article></noscript><!-- agent:content:end -->
