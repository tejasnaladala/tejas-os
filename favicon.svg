<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <style>
    .signal-a { animation: signal-a 2.4s steps(1, end) infinite; }
    .signal-b { animation: signal-b 2.4s steps(1, end) infinite; }
    .signal-c { animation: signal-c 2.4s steps(1, end) infinite; }
    .signal-d { animation: signal-d 2.4s steps(1, end) infinite; }
    .core { animation: core 2.4s steps(1, end) infinite; }
    @keyframes signal-a { 0%, 24% { opacity: 1 } 25%, 100% { opacity: .28 } }
    @keyframes signal-b { 0%, 24%, 50%, 100% { opacity: .28 } 25%, 49% { opacity: 1 } }
    @keyframes signal-c { 0%, 49%, 75%, 100% { opacity: .28 } 50%, 74% { opacity: 1 } }
    @keyframes signal-d { 0%, 74% { opacity: .28 } 75%, 100% { opacity: 1 } }
    @keyframes core { 0%, 49%, 100% { fill: #11110f } 50%, 74% { fill: #3275c7 } }
    @media (prefers-reduced-motion: reduce) {
      .signal-a, .signal-b, .signal-c, .signal-d, .core { animation: none }
    }
  </style>
  <rect width="32" height="32" fill="#f4f1e8"/>
  <path fill="#11110f" d="M5 6h22v5h-8v15h-6V11H5z"/>
  <rect class="core" x="14" y="14" width="4" height="4" fill="#11110f"/>
  <rect class="signal-a" x="3" y="3" width="4" height="4" fill="#ed6d91"/>
  <rect class="signal-b" x="25" y="3" width="4" height="4" fill="#3275c7"/>
  <rect class="signal-c" x="25" y="25" width="4" height="4" fill="#69a95c"/>
  <rect class="signal-d" x="3" y="25" width="4" height="4" fill="#efb43a"/>
  <rect x="7" y="3" width="5" height="2" fill="#ed6d91" opacity=".72"/>
  <rect x="27" y="7" width="2" height="5" fill="#3275c7" opacity=".72"/>
  <rect x="20" y="27" width="5" height="2" fill="#69a95c" opacity=".72"/>
  <rect x="3" y="20" width="2" height="5" fill="#efb43a" opacity=".72"/>
</svg>
