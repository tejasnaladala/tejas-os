      <!-- agent:content:start --><noscript><article class="agent-readable" aria-label="About Tejas Naladala"><h2>I'm 19. I build and research full-time.</h2><p>My roots lie in a small coastal village in South India.</p><p>My family farmed for generations. We grew chilli, tobacco, and other food crops. I grew up with all of it. The land, the crops, the people, the chemicals, the machines, and even the money problems in a traditional Indian family dynamic.</p><p>I now study engineering at the University of Washington, though I don&#039;t really believe in formal education.</p><p>Academically, I was far from exceptional. I never cared enough to study for grades. My dad once dropped a course and retook it the next semester because he got a 97 instead of a 100. That was why we couldn&#039;t ever have a peaceful relationship while I was growing up. He was a perfectionist. I believed imperfections were sometimes what made things perfect.</p><p>I fell in love with the art of &quot;fuck around and find out&quot;.</p><p>I cared about completely different things. I would break open my ceiling fan to see if I could make it spin in reverse. I would try building my own hydroponic irrigation system. I would change how my coffee machine brewed coffee. I would try Pavloving different animals into doing chores for me. Yes, my dog is more capable than a $20,000 Unitree G1 at doing laundry.</p><p>I picked up beatboxing, then dance, street plays, drama, debate, and pageants. I performed in front of tens of thousands of people. I led blood, book, and clothing donation drives. I led a thousand students as school captain.</p><p>I loved it. I loved being on stage. I loved people. I loved making people laugh. I loved being the chaos and also being the person who could hold it together.</p><p>I started doing things that made me happy.</p><p>and somewhere along the way, I fell in love with problems.</p><p>I love being a founder because it means</p><h2>Freedom</h2><ul><li>Freedom to not have my entire life decided for me or imposed upon me because of societal norms.</li><li>Freedom to become obsessed with something nobody around me understands yet.</li><li>Freedom to build something because I think it should exist.</li><li>Freedom to change direction when I realise I was wrong.</li><li>Freedom to work with people I actually respect.</li><li>Freedom to fail on my own terms.</li><li>Freedom to change lives.</li><li>Freedom to be me.</li></ul><p>So I started building.</p><p>I have built high-voltage power electronics and sold plasma reactors.</p><p>I built hull-integrity sensing hardware for a U.S. Navy project and deployed subsea instrumentation in the Pacific.</p><p>I built computer-vision and event-logging pipelines during work with WHOI, NSF&#039;s OOI, and UW APL.</p><p>I surveyed the Axial Seamount, the most active underwater volcano in the Pacific Northwest, 300 miles off the coast of Oregon, using an 11,000-pound robot.</p><p>At OpenTrade, I built the model-evaluation and ranking stack for a product that reached 0 to 150,000 users in two months.</p><p>I collaborated on MTEB. The package reached roughly 17 million PyPI downloads by August 2026.</p><p>I built a knee-MRI research pipeline around a Radiological Society of North America challenge dataset.</p><p>I fabricated and characterised dye-sensitised solar-cell architectures with the group behind the world-record efficiency.</p><p>I published 3 peer-reviewed papers, 2 technical reports, and presented at an international conference.</p><p>I&#039;m also intrigued by psychedelics, ego death, consciousness, religion, God, ambition, love, and what it means to be human.</p><p>Spirituality often confuses me.</p><p>Curiosity is the only thing tying this page together.</p><p>I&#039;m getting at something here. I promise.</p><p><strong>- Tejas Naladala</strong></p></article></noscript><!-- agent:content:end -->
